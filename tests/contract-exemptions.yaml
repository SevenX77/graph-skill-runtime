# DO NOT EDIT without PM approval. Contract exemptions are governance records for
# intentional, reviewed retirement of a feature from the round-28 manifest set:
# which features go away, which ones replace them, who approved it and when the
# record itself should be cleaned up.
#
# The authoritative shape is `$defs.contract_exemptions` in
# `spec/round28-manifest-schema.yaml`, and
# `tests/test_round28_contract_manifests.py` validates THIS file against it — not
# only the fixtures beside it. That is what makes the schema this path's single
# owner.
#
# Byte seals over FROZEN documents are a different concept and live in
# `tests/contract-seals.yaml`, owned by `tests/test_contract_hash_lock.py`. They
# shared this path until F-T3, and the cost was exactly what a second owner
# costs: the real file stopped satisfying the authoritative schema while every
# test stayed green.
#
# Schema example:
# version: "1"
# exemptions:
#   - exemption_id: EX-0001-example
#     pr: "PR-123"
#     pm_approval: "PM approved this exception, with date."
#     reason: "Why this retirement is allowed."
#     symbols: []
#     fields: []
#     hashes: []
#     affected_features:
#       - F-old-feature
#     replacement_feature_ids:
#       - F-replacement-feature
#     expires_or_cleanup: "Remove once the replacement ships."

version: "1"
exemptions: []
