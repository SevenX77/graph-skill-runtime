# DO NOT EDIT without PM approval. Contract exemptions are governance records for
# intentional, reviewed drift from frozen API/spec/hash baselines.
#
# A hash exemption pins ONE approved set of bytes, not a file: `file` plus the
# exact `sha256` those approved bytes hash to. Once the document drifts past
# that digest, `test_contract_hash_lock` fires again. Keying an exemption by
# path alone would make it a permanent unlock, which is the opposite of what a
# lock is for.
#
# Schema example:
# version: "1"
# exemptions:
#   - exemption_id: EX-0001-example
#     file: "docs/skill-spec/01-PORTABLE-GSKILL-V1.md"
#     sha256: "the 64-character SHA-256 hex digest of the approved bytes"
#     reason: "Why this drift is allowed."
#     pr: "PR-123"
#     pm_approval: "PM approved this exception, with date."
#     symbols: []
#     fields: []
#     expires_or_cleanup: "Remove once the hash table is re-pinned in PR-124."

version: "1"
exemptions: []
