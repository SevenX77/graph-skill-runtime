# DO NOT EDIT without owner approval. This file is the SINGLE carrier of every
# byte seal this repository holds: a `FROZEN` document's current pinned digest IS
# the last `seals` record naming it. There is no second table anywhere in the
# test suite — a digest that lives only in Python is a governance record nobody
# has to file, and `.github/CODEOWNERS` covers this path but not the test file,
# so "just re-pin the constant" used to be a way around owner review.
#
# This file holds byte seals and NOTHING else. Feature-retirement exemptions live
# in `tests/contract-exemptions.yaml`, whose shape is owned by the
# `$defs.contract_exemptions` schema in `spec/round28-manifest-schema.yaml`. The
# two concepts shared one path until F-T3, which meant that path had two schema
# owners: validating the real file against the authoritative schema failed while
# the whole suite stayed green, because only fixtures were ever validated. One
# concept, one file, one owner.
#
# Revising a FROZEN document = edit the document AND append one record here, in
# the same pull request. List order is time order; the LAST record for a file is
# its current seal. Earlier records stay as the audit trail of what was approved
# when, and nothing is ever rewritten in place.
#
# Every record carries exactly these keys — a missing, misspelled or extra key is
# a hard failure, never a silently skipped record:
#
#   exemption_id  EX-NNNN-<lowercase-slug>, unique across this file
#   file          repository-relative path of the sealed document
#   sha256        digest of the approved bytes: CRLF/CR normalised to LF, then
#                 SHA-256 over the UTF-8 encoding
#   reason        what changed and on what ruling or evidence
#   pr            the pull request (or pre-extraction commit) carrying the change
#   pm_approval   the owner sign-off this record rests on
#
# One optional key is allowed: `expires_or_cleanup`, for a seal that is meant to
# be superseded by a named follow-up.
#
# `version` names the record format this file is written in; the loader accepts
# exactly the versions it knows how to read.
#
# The lock is enforced by tests/test_contract_hash_lock.py, which also asserts
# both directions of the bijection: every document declaring `status: FROZEN`
# has a record here, and no record names a document declaring some other status.

