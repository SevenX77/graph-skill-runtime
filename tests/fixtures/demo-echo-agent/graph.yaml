schema_version: gskill.graph.v1
graph_id: root
description: Echo a concise review note.
io:
  inputs:
    type: object
    required: [note]
    properties:
      note:
        type: string
  outputs:
    type: object
    properties:
      echoed_note:
        type: string
phases:
  - id: echo
    depends_on: [input]
    output: true
