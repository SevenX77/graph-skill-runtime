[project]
name = "graph-skill-runtime"
version = "0.1.0a1"
description = "Agent-native runtime for compiled graph skills"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=1.3.9,<1.4.0",
    "langchain-core>=1.3.1,<1.5.0",
    "langgraph>=1.2.0,<1.3.0",
    "langgraph-prebuilt>=1.0.6,<1.2.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "ruamel.yaml>=0.18.0,<0.19.0",
    "jsonschema>=4,<5",
    "mcp>=2.1.1,<3.0.0",
]

[project.scripts]
gskill = "graph_skill_runtime.adapters.cli:main"

[project.optional-dependencies]
embedded = [
    "langchain-openai>=1.3.5,<1.4.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "coverage>=7.0.0,<8.0.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "pip-audit>=2.7.3,<3.0.0",
    "langchain-openai>=1.3.5,<1.4.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_skill_runtime"]
exclude = [
    "src/graph_skill_runtime/examples/**",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true
markers = [
    "tier1: core smoke-tier tests for fast PR confidence",
]

[project.urls]
Repository = "https://github.com/SevenX77/graph-skill-runtime"
Issues = "https://github.com/SevenX77/graph-skill-runtime/issues"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "PLW1514"]
preview = true
explicit-preview-rules = true
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["C901"]
"src/graph_skill_runtime/core/error_registry.py" = ["E501"]
"src/graph_skill_runtime/cognitive/prompt.py" = ["E501"]
"src/graph_skill_runtime/core/graph_assembler.py" = ["C901"]
"src/graph_skill_runtime/core/loader.py" = ["C901"]
"src/graph_skill_runtime/core/state.py" = ["C901", "E501"]
"src/graph_skill_runtime/runtime/state_mapper.py" = ["C901", "E501"]
"tests/**" = ["E501"]
"tests/test_round30_pr*_*.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
exclude = ["tests", "scripts"]

[[tool.mypy.overrides]]
module = "langgraph.checkpoint.postgres.*"
ignore_missing_imports = true

[tool.coverage.run]
relative_files = true
parallel = true
source = ["src/graph_skill_runtime"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "langchain_anthropic", "yaml", "yaml.*"]
ignore_missing_imports = true
