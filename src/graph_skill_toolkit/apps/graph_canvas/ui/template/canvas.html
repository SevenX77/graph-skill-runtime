<!doctype html>
<html lang="zh" data-scheme="prism">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graph Skill 画布</title>
  <script>
    try {
      var chosen = localStorage.getItem("canvas-scheme");
      document.documentElement.dataset.scheme = chosen === "prism" || chosen === "aurora" ? chosen : matchMedia("(prefers-color-scheme: dark)").matches ? "aurora" : "prism";
    } catch (error) { if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.scheme = "aurora"; }
  </script>
  <style>/* INLINE_CSS ../../../../../../vendor/ui-ux-template/core/dist/tokens.css */</style>
  <style>/* INLINE_CSS ../../../../../../vendor/ui-ux-template/core/styles/base.css */</style>
  <style>/* INLINE_CSS ../../../../../../vendor/ui-ux-template/core/styles/scenes.css */</style>
  <style>
    html, body, #app { height: 100%; }
    body { overflow: hidden; padding-bottom: 0; }
    h2 { margin: 0; }
    code, pre { font-family: var(--mono); }

    /* Full-bleed canvas with floats: the graph fills the window; the header, host chip and detail float over it. */
    .workbench { position: relative; width: 100%; height: 100dvh; background: var(--app); }
    .empty-state { display: grid; place-content: center; height: 100%; padding: 24px; color: var(--ink2); text-align: center; overflow-wrap: anywhere; }

    .cv-board { position: absolute; inset: 0; }
    .cv-stage { position: absolute; inset: 0; overflow: hidden; background-image: radial-gradient(var(--dot) .8px, transparent 1px); background-size: 18px 18px; cursor: grab; }
    .cv-stage.cv-grabbing { cursor: grabbing; }
    .cv-stage.cv-anim .cv-world { transition: transform .52s var(--ease); }
    .cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: opacity .3s; }
    .cv-world.stale { opacity: .45; }
    .cv-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    .cv-edges path.e { fill: none; stroke: var(--ink3); stroke-width: 1.4; stroke-linecap: round; transition: stroke .25s, opacity .3s; }
    .cv-edges path.e.on { stroke-width: 1.8; }
    .cv-edges marker path { fill: var(--ink3); }
    :root:not([data-attention=raise]) .cv-board.ux-active .cv-edges path.e:not(.on) { opacity: .3; }

    /* A node: kind badge and id. Selection is shown by background and depth, never by a ring. */
    .cv-node { position: absolute; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--r-ctl); background: var(--card); box-shadow: var(--e1); cursor: pointer; outline: none; transition: box-shadow var(--t-block) ease, background .25s, opacity .3s; }
    .cv-node.ux-hover { box-shadow: var(--lift); z-index: 1; }
    .cv-node.on { background: var(--sel); box-shadow: var(--e3); z-index: 2; }
    .cv-node:focus-visible { box-shadow: var(--e2), inset 0 0 0 1.5px var(--signal); }
    :root:not([data-attention=raise]) .cv-node.off { opacity: .3; }
    /* With a selection, its neighbours stay readable: the selection, not the pointer, says what relates. */
    .cv-board.ux-active .cv-node:not(.off).ux-dim { opacity: 1; }
    .cv-node em { font: 700 11px/24px var(--font); font-style: normal; width: 24px; height: 24px; border-radius: var(--r-ctl); flex: none; text-align: center; background: color-mix(in srgb, var(--col) 20%, var(--card)); color: var(--col); }
    .cv-node span { display: grid; min-width: 0; }
    .cv-node b { font: 600 13px/1.3 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    .cv-node small { font-size: 10.5px; letter-spacing: .06em; color: var(--ink2); }

    /* Zoom and fit. */
    .cvz { opacity: 1; }

    /* The selected node's detail is an overlay; the nodes keep their places. */
    .cv-side { position: absolute; z-index: 7; top: 54px; right: 10px; bottom: 10px; width: 280px; overflow: auto; visibility: hidden; background: var(--card); border-radius: var(--r-card); box-shadow: var(--e3); transform: translateX(calc(100% + 16px)); transition: transform .52s var(--ease), visibility 0s .52s; }
    .cv-board.ux-active .cv-side { transform: none; visibility: visible; transition-delay: 0s; }
    .cv-side-in { display: grid; gap: calc(8px * var(--y)); padding: calc(12px * var(--y)) 14px; }
    .cv-side h2 { font: 650 16px/1.3 var(--mono); overflow-wrap: anywhere; }
    .cv-side .tag { justify-self: start; }
    .cv-kind-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--col); }
    .cv-facts { display: grid; gap: calc(4px * var(--y)); margin: 0; font-size: 12.5px; }
    .cv-facts > div { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; }
    .cv-facts dt { color: var(--ink2); }
    .cv-facts dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

    /* Floating header: what graph, from which Skill, and anything wrong with it. */
    .cv-head { position: absolute; z-index: 8; top: 10px; left: 10px; max-width: min(560px, calc(100% - 340px)); display: grid; gap: calc(3px * var(--y)); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e2); }
    .cv-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .cv-title b { font: 650 14px/1.3 var(--mono); overflow-wrap: anywhere; }
    #skill-path { font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
    #status { font-size: 11.5px; color: var(--bad); }
    #status:empty { display: none; }
    .invalid-graph { margin-top: calc(6px * var(--y)); max-height: 42vh; overflow-y: auto; padding: calc(8px * var(--y)) 10px; border-radius: var(--r-ctl); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
    .invalid-graph h2 { font-size: 13px; color: var(--bad); }
    .invalid-graph-note { margin-top: 3px; font-size: 11.5px; color: var(--ink2); }
    .invalid-graph ul { margin: calc(6px * var(--y)) 0 0; padding: 0; list-style: none; }
    .invalid-graph li { padding: calc(4px * var(--y)) 0; font-size: 12px; overflow-wrap: anywhere; }
    .invalid-graph li + li { box-shadow: inset 0 1px var(--line); }
    .invalid-graph code { font-size: 11.5px; font-weight: 600; color: var(--bad); }
    .invalid-graph-where { display: block; font: 11px/1.5 var(--mono); color: var(--ink2); }

    /* Host chip, top right. */
    .cv-host { position: absolute; z-index: 8; top: 10px; right: 10px; display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: var(--r-card); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e1); font-size: 12px; font-weight: 600; color: var(--ink2); }
    .connection { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .cv-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); }
    .cv-dot.on { background: var(--good); } .cv-dot.wait { background: var(--c3); } .cv-dot.off { background: var(--bad); }
    .cv-host .seg { margin-left: 4px; background: none; padding: 0; }
    .cv-host .seg-ind { background: var(--sel); box-shadow: none; }
    .cv-host .seg button { padding: 3px 9px; font-size: 12px; }
    .cv-host .seg button.on { color: var(--ink); }
    .cv-host-info { position: relative; }
    .cv-host-info summary { list-style: none; cursor: pointer; padding: 2px 6px; border-radius: var(--r-ctl); }
    .cv-host-info summary::-webkit-details-marker { display: none; }
    .cv-host-info summary:hover { background: var(--sel); color: var(--ink); }
    .cv-host-info pre { position: absolute; right: 0; top: calc(100% + 8px); width: min(380px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; margin: 0; padding: 10px; border-radius: var(--r-card); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e3); font-size: 11px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font-weight: 400; }

    @media (max-width: 719px) {
      .cv-head { right: 10px; max-width: none; top: 56px; }
      .cv-side { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 55%; transform: translateY(calc(100% + 16px)); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>Graph Skill 画布需要启用 JavaScript。</noscript>
  <script id="plugin-base-snapshot" type="application/json">null</script>
  <script>/* APP_BUNDLE */</script>
</body>
</html>
