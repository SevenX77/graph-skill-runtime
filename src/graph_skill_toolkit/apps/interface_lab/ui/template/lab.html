<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plugin Interface Lab</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif;
      --bg: #f6f7f9; --surface: #fff; --soft: #f1f3f7; --text: #24304a; --muted: #63718a; --border: #dce1e9; --accent: #5b54c4; --accent-soft: #eeecfc;
      --ok: #2f855a; --ok-soft: #e6f4ec; --warn: #a96400; --warn-soft: #fdf3e2; --bad: #b0413e; --bad-soft: #fbeceb; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15181f; --surface: #1d2129; --soft: #252a34; --text: #e3e7ef; --muted: #98a2b6; --border: #343b48; --accent: #a49cf5; --accent-soft: #2c2949;
      --ok: #6fcf97; --ok-soft: #1f3529; --warn: #f2b45a; --warn-soft: #3a2f1c; --bad: #f08a86; --bad-soft: #3d2423; } }
    * { box-sizing: border-box; }
    html, body, #app { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; background: var(--surface); cursor: pointer; }
    button:hover:enabled { border-color: var(--accent); background: var(--accent-soft); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:enabled { filter: brightness(1.08); background: var(--accent); }
    button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    code, pre, textarea { font-family: var(--mono); font-size: 12px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lab { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
    .lab-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .lab-header h1 { margin: 0; font-size: 16px; }
    .lab-header .facts { color: var(--muted); font-size: 12px; }
    .lab-header .facts b { color: var(--text); font-weight: 600; }
    .lab-body { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; min-height: 0; }
    .op-list { overflow-y: auto; padding: 8px; border-right: 1px solid var(--border); background: var(--surface); }
    .op-list h2 { margin: 10px 6px 4px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
    .op-list button { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; text-align: left; padding: 5px 8px; background: transparent; }
    .op-list button[aria-current="true"] { background: var(--accent-soft); }
    .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.available { background: var(--ok); } .dot.unavailable { background: var(--bad); } .dot.unknown { background: var(--warn); }
    .op-list .count { margin-left: auto; color: var(--muted); font-size: 11px; }
    .detail { overflow-y: auto; padding: 14px 18px 40px; }
    .detail h2 { margin: 0; font-size: 17px; } .detail h2 code { font-size: 12px; color: var(--muted); font-weight: normal; margin-left: 6px; }
    .detail h3 { margin: 16px 0 6px; font-size: 12px; color: var(--muted); }
    .purpose { margin: 6px 0 0; }
    .expect { display: grid; gap: 6px; }
    .expect div { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
    .expect div.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .expect b { display: inline-block; min-width: 54px; }
    .limits { margin: 0; padding-left: 18px; }
    .limits li { margin: 2px 0; }
    .capability { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 10px; background: var(--soft); font-size: 12px; }
    textarea { width: 100%; min-height: 110px; padding: 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .run { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .run-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .status { padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .status.completed { color: var(--ok); background: var(--ok-soft); } .status.accepted, .status.pending { color: var(--warn); background: var(--warn-soft); }
    .status.unsupported, .status.rejected, .status.error { color: var(--bad); background: var(--bad-soft); }
    .run-head time { margin-left: auto; color: var(--muted); font-size: 11px; }
    .run-message { padding: 8px 10px 0; margin: 0; }
    .evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 10px; }
    .evidence section { min-width: 0; padding: 6px 8px; border-radius: 6px; background: var(--soft); }
    .evidence h4 { margin: 0 0 3px; font-size: 11px; color: var(--muted); }
    .evidence pre { max-height: 220px; overflow-y: auto; }
    .readout { margin: 0 10px 8px; padding: 8px 10px; border: 1px dashed var(--accent); border-radius: 7px; }
    .readout h4 { margin: 0 0 4px; font-size: 12px; color: var(--accent); }
    .compare { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--soft); }
    .compare input { flex: 1 1 180px; min-width: 0; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
    .muted { color: var(--muted); font-size: 12px; }
    .events { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: var(--surface); }
    .events-head { display: flex; gap: 6px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
    .events-head h2 { margin: 0; font-size: 13px; } .events-head input { flex: 1; min-width: 0; padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
    .event-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
    .event { padding: 5px 0; border-bottom: 1px solid var(--border); }
    .event summary { cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
    .event summary code { font-weight: 600; } .event summary span { margin-left: auto; color: var(--muted); font-size: 11px; }
    .event .source { color: var(--muted); font-size: 11px; }
    .banner { margin: 0 0 10px; padding: 8px 10px; border-radius: 7px; background: var(--bad-soft); color: var(--bad); }
    @media (max-width: 980px) { .lab-body { grid-template-columns: 190px minmax(0, 1fr); } .events { grid-column: 1 / -1; max-height: 40dvh; border-left: 0; border-top: 1px solid var(--border); } .lab-body { overflow-y: auto; } }
    @media (max-width: 640px) { .lab-body { grid-template-columns: 1fr; } .op-list { max-height: 30dvh; border-right: 0; } .evidence { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>Plugin Interface Lab 需要启用 JavaScript。</noscript>
  <script id="plugin-base-snapshot" type="application/json">null</script>
  <script>/* APP_BUNDLE */</script>
</body>
</html>
