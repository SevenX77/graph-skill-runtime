<!doctype html>
<html lang="zh" data-scheme="prism">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plugin Interface Lab</title>
  <script>
    try {
      var chosen = localStorage.getItem("lab-scheme");
      document.documentElement.dataset.scheme = chosen === "prism" || chosen === "aurora" ? chosen : matchMedia("(prefers-color-scheme: dark)").matches ? "aurora" : "prism";
    } catch (error) { if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.scheme = "aurora"; }
    // The page's mode is known before the first paint, so the layout does not change once the app starts.
    try { document.documentElement.dataset.mode = /^#lab\//.test(location.hash || localStorage.getItem("lab-route") || "") ? "lab" : "guide"; }
    catch (error) { document.documentElement.dataset.mode = /^#lab\//.test(location.hash) ? "lab" : "guide"; }
  </script>
  <style>/* INLINE_CSS ../../../../../../vendor/ui-ux-template/core/dist/tokens.css */</style>
  <style>/* INLINE_CSS ../../../../../../vendor/ui-ux-template/core/styles/base.css */</style>
  <style>
    html, body, #app { height: 100%; }
    body { overflow: hidden; padding-bottom: 0; }
    pre, code, textarea.input { font-family: var(--mono); font-size: 12px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    code { overflow-wrap: anywhere; }
    h2, h3 { margin: 0; }
    h3 { font-size: 13px; }

    /* Main with aside: operation list | detail | event log. Regions separate by background, never by a line. */
    .il-work { display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; gap: 8px; height: 100dvh; padding: 8px; }
    .il-side { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 60px 10px 12px; border-radius: var(--r-panel); background: var(--app); }
    .il-main { min-width: 0; margin-top: 52px; overflow-y: auto; padding: 4px 12px 44px; }
    .il-main > * { max-width: 920px; margin-inline: auto; }
    .il-main.scrolled { mask-image: var(--fade-t); -webkit-mask-image: var(--fade-t); }
    .il-stack { display: grid; gap: calc(10px * var(--y)); }
    .il-stack + .il-stack { margin-top: calc(18px * var(--y)); }

    /* Top bar: the mode switch first, then the host, then display settings. */
    .bar-in .seg.il-modes button { padding: 0 14px; }
    .il-host { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--ink2); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .bar-in > button.il-open { display: none; }

    /* Operation list. */
    .il-brand { display: grid; gap: 2px; padding: 0 8px; }
    .il-brand b { font-size: 15px; }
    .il-tally { display: grid; grid-template-columns: repeat(2, max-content); gap: 3px 14px; padding: calc(6px * var(--y)) 8px 0; font-size: 11.5px; color: var(--ink2); }
    .il-tally span { display: inline-flex; align-items: center; gap: 5px; }
    .il-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink3); }
    .il-dot.available, .il-dot.completed { background: var(--good); }
    .il-dot.unavailable, .il-dot.unsupported, .il-dot.rejected, .il-dot.error { background: var(--bad); }
    .il-dot.unknown, .il-dot.accepted, .il-dot.pending { background: var(--c3); }
    .seg.il-ops { display: flex; flex: none; flex-direction: column; gap: 1px; padding: 0; margin-top: calc(6px * var(--y)); background: none; }
    .il-ops .seg-ind { background: var(--sel); box-shadow: none; }
    .il-ops h2 { font-size: var(--lab-s); line-height: 1.3; font-weight: 600; letter-spacing: var(--lab-ls); text-transform: var(--lab-tt); color: var(--ink2); padding: calc(9px * var(--y)) 8px calc(2px * var(--y)); }
    .seg.il-ops button { display: flex; align-items: center; gap: 7px; padding: 4px 8px; font: 500 11.5px/1.4 var(--mono); text-align: left; overflow-wrap: anywhere; color: var(--ink2); }
    .seg.il-ops button.on { color: var(--ink); font-weight: 600; }
    .seg.il-ops button.il-start { font: 600 12.5px/1.4 var(--font); margin-top: calc(6px * var(--y)); }
    .il-count { margin-left: auto; font-size: 11px; color: var(--ink2); }
    .il-mode-tag { margin-left: auto; font-size: 11px; color: var(--bad); }
    .il-mode-tag + .il-count { margin-left: 6px; }
    .il-env { margin-top: auto; padding: calc(12px * var(--y)) 8px 0; }
    .il-env summary { cursor: pointer; }
    .il-fact { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding-block: calc(2px * var(--y)); color: var(--ink2); }
    .il-fact b { color: var(--ink); font-weight: 600; text-align: right; overflow-wrap: anywhere; }

    /* Detail column. */
    .il-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .il-head h2 { font: 650 17px/1.3 var(--mono); letter-spacing: 0; overflow-wrap: anywhere; margin-right: 2px; }
    .il-try { margin-left: auto; }
    .il-purpose { margin-top: calc(6px * var(--y)); }
    .il-warn { color: var(--bad); }
    .il-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: calc(8px * var(--y)); }
    .il-section-title { font-size: 13px; font-weight: 650; }
    .il-gap { margin-top: calc(8px * var(--y)); }
    .il-run-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .il-presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 200px; min-width: 0; margin: 0; font-size: 12.5px; }
    .il-field { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: calc(10px * var(--y)); }
    .il-field .input { font-size: 12px; padding: 6px 10px; }
    textarea.input { display: block; margin-top: calc(10px * var(--y)); white-space: pre; overflow: auto; resize: vertical; line-height: 1.5; }
    .il-expect { display: grid; gap: calc(3px * var(--y)); }
    .il-expect p + .label { margin-top: calc(7px * var(--y)); }
    .il-other { margin-top: calc(6px * var(--y)); }
    .il-other summary { cursor: pointer; }
    .il-other p { margin-top: 4px; color: var(--ink2); }
    .il-limits { padding-left: 18px; font-size: 12.5px; }

    /* Call records: the newest is open; older ones fold to one line. */
    .il-run-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .il-run-head time { margin-left: auto; font-size: 11.5px; color: var(--ink2); }
    .il-message { margin-top: calc(8px * var(--y)); }
    details.il-older > summary { cursor: pointer; list-style: none; }
    details.il-older > summary::-webkit-details-marker { display: none; }
    .il-older-msg { flex-basis: 100%; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    details.il-older[open] .il-older-msg { display: none; }
    .il-evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: calc(10px * var(--y)); }
    .il-evidence > section { min-width: 0; padding: calc(7px * var(--y)) 10px; border-radius: var(--r-ctl); background: var(--sunk); }
    .il-evidence > section.wide { grid-column: 1 / -1; }
    .il-evidence .label { display: block; margin-bottom: calc(3px * var(--y)); }
    .il-empty { margin-top: calc(6px * var(--y)); }
    .il-scroll { max-height: 220px; overflow-y: auto; }
    .il-scroll.fades { mask-image: var(--fade-b); -webkit-mask-image: var(--fade-b); }
    .il-readout { margin-top: calc(10px * var(--y)); padding: calc(8px * var(--y)) 10px; border-radius: var(--r-ctl); background: var(--sel); }
    .il-compare { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: calc(10px * var(--y)); }
    .il-compare .input { flex: 1 1 160px; width: auto; min-width: 0; font-size: 12px; padding: 6px 10px; }
    .il-compare .seg button { padding: 4px 9px; font-size: 12px; }
    .il-banner { margin-bottom: calc(10px * var(--y)); color: var(--bad); }
    .il-notice { margin-bottom: calc(10px * var(--y)); font-size: 12.5px; color: var(--ink2); background: var(--sel); }

    /* Guide mode. */
    .il-hero h2 { font-size: 20px; margin-bottom: calc(6px * var(--y)); }
    .il-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: calc(12px * var(--y)); }
    .il-parts > div { display: grid; align-content: start; gap: 3px; padding: calc(9px * var(--y)) 12px; border-radius: var(--r-ctl); background: var(--sunk); }
    .il-parts code { font-size: 11.5px; color: var(--ink2); }
    .il-parts span { font-size: 12.5px; color: var(--ink2); }
    .il-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .il-step-head { display: flex; align-items: center; gap: 8px; margin-bottom: calc(5px * var(--y)); }
    .il-step-head a { margin-left: auto; }
    .il-step-no { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--signal); color: var(--on-signal); font-size: 11px; font-weight: 700; flex: none; }
    .il-code { margin: 0; padding: calc(8px * var(--y)) 10px; border-radius: var(--r-ctl); background: var(--sunk); font-size: 11.5px; white-space: pre; overflow-x: auto; overflow-wrap: normal; }
    .il-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .il-envelope { margin: calc(4px * var(--y)) 0 calc(8px * var(--y)); }
    .il-kv { display: grid; gap: calc(4px * var(--y)); margin: 0; }
    .il-kv > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 12.5px; }
    .il-kv dt { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .il-kv dd { margin: 0; color: var(--ink2); }
    .il-hosts { margin-top: calc(8px * var(--y)); }
    .il-hosts > div { grid-template-columns: 64px minmax(0, 1fr); padding: calc(7px * var(--y)) 10px; border-radius: var(--r-ctl); }
    .il-hosts > div.current { background: var(--sel); }
    .il-hosts > div.current dd { color: var(--ink); }
    .il-shortcuts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: calc(8px * var(--y)); }
    .il-shortcuts .btn { gap: 8px; }
    .il-params { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
    .il-params th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink2); padding: 0 10px calc(6px * var(--y)) 0; box-shadow: inset 0 -1px var(--line); white-space: nowrap; }
    .il-params td { padding: calc(7px * var(--y)) 10px calc(7px * var(--y)) 0; vertical-align: top; }
    .il-params tr + tr td { box-shadow: inset 0 1px var(--line); }
    .il-params td:nth-child(1) { white-space: nowrap; }
    .il-params td:nth-child(2) { width: 30%; color: var(--ink2); }
    .il-params td:nth-child(3) { width: 40px; white-space: nowrap; font-size: 12px; }
    .il-returns { margin-top: calc(10px * var(--y)); display: grid; gap: calc(4px * var(--y)); }

    /* Event log. */
    .il-events-head { display: flex; align-items: center; gap: 6px; margin-bottom: calc(8px * var(--y)); }
    .il-events-head h2 { font-size: 13px; flex: none; }
    .il-events-head .input { min-width: 0; padding: 5px 9px; font-size: 12px; }
    .il-event { border-radius: var(--r-ctl); }
    .il-event + .il-event { margin-top: 1px; }
    .il-event[open], .il-event:hover { background: var(--card); }
    .il-event summary { display: flex; align-items: baseline; gap: 6px; padding: calc(4px * var(--y)) 8px; cursor: pointer; }
    .il-event summary code { font-weight: 600; }
    .il-event summary span { margin-left: auto; flex: none; font-size: 11px; color: var(--ink2); }
    .il-event-body { padding: 0 8px calc(6px * var(--y)); }

    /* Reading the guide needs no event log beside it: there it opens as an overlay, as it does in narrower frames. */
    :root[data-mode=guide] .il-work { grid-template-columns: 240px minmax(0, 1fr); }
    :root[data-mode=guide] .bar-in > button.il-open.events { display: flex; }
    :root[data-mode=guide] .il-side.events { position: fixed; z-index: 800; top: 8px; right: 8px; bottom: 8px; width: min(360px, calc(100vw - 16px)); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e4); opacity: 0; visibility: hidden; translate: 12px 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s .25s; }
    :root[data-mode=guide] .il-side.events.show { opacity: 1; visibility: visible; translate: 0 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s; }

    /* Claude's side pane and Codex's inline view: the event log becomes an overlay; the detail keeps its place. */
    @media (max-width: 1179px) {
      .il-work, :root[data-mode=guide] .il-work { grid-template-columns: 236px minmax(0, 1fr); }
      .bar-in > button.il-open.events { display: flex; }
      .il-side.events { position: fixed; z-index: 800; top: 8px; right: 8px; bottom: 8px; width: min(360px, calc(100vw - 16px)); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e4); opacity: 0; visibility: hidden; translate: 12px 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s .25s; }
      .il-side.events.show { opacity: 1; visibility: visible; translate: 0 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s; }
    }
    @media (max-width: 899px) {
      .il-host { max-width: 130px; }
      .il-pair { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 719px) {
      .il-work, :root[data-mode=guide] .il-work { grid-template-columns: minmax(0, 1fr); padding: 0; }
      .il-main { margin-top: 56px; padding-inline: 16px; }
      .bar-in > button.il-open.nav { display: flex; }
      .il-host { display: none; }
      .il-side.nav { position: fixed; z-index: 800; top: 8px; left: 8px; bottom: 8px; width: min(300px, calc(100vw - 16px)); background: var(--glass); backdrop-filter: blur(22px) saturate(1.1); box-shadow: var(--e4); opacity: 0; visibility: hidden; translate: -12px 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s .25s; }
      .il-side.nav.show { opacity: 1; visibility: visible; translate: 0 0; transition: opacity .25s, translate .35s var(--ease), visibility 0s; }
      .il-evidence, .il-parts { grid-template-columns: minmax(0, 1fr); }
      .il-kv > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
      .il-params td:nth-child(2) { width: auto; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>Plugin Interface Lab 需要启用 JavaScript。</noscript>
  <script id="plugin-base-snapshot" type="application/json">null</script>
  <script>/* APP_BUNDLE */</script>
</body>
</html>
