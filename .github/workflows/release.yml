name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.11
      - name: Verify release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate and bind release artifacts to this tag checkout
        run: >-
          uv run --no-project --python 3.11 python scripts/accept_release_artifacts.py validate
          --dist-dir dist
          --manifest build/release-artifacts.json
          --source-commit "${{ github.sha }}"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - name: Upload release artifact manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-manifest
          path: build/release-artifacts.json
          if-no-files-found: error

  verify-distributions:
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync source-test dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts tools
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Validate feature contracts
        run: >-
          uv run python scripts/validate_round28_manifest.py
          spec/features.yaml
          spec/source_file_map.yaml
          spec/contract_map.yaml
      - name: Run authoritative tests
        run: uv run pytest --tb=short -q
      - name: Download candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: candidate/dist
      - name: Download release artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-manifest
          path: candidate/build
      - name: Accept pip, uv, CLI, MCP, and durable behavior from built artifacts
        run: >-
          uv run --no-project --python 3.11 python scripts/accept_release_artifacts.py accept
          --dist-dir candidate/dist
          --manifest candidate/build/release-artifacts.json
          --expected-source-commit "${{ github.sha }}"
          --logic-skill examples/hello-world
          --agent-skill tests/fixtures/demo-echo-agent
          --evidence build/package-acceptance-${{ matrix.os }}.json
      - name: Upload package acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-acceptance-${{ matrix.os }}-python-3.11
          path: build/package-acceptance-${{ matrix.os }}.json
          if-no-files-found: error

  publish-to-pypi:
    needs: [build-distributions, verify-distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/graph-skill-runtime
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
