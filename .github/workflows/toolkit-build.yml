name: Toolkit packages

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/graph-skill/**'
      - 'src/graph_skill_runtime/**'
      - 'docs/skill-spec/01-PORTABLE-GSKILL-V1.md'
      - 'LICENSE'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/toolkit-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            native: '--native'
          - target: darwin-arm64
            os: macos-15
            native: '--native'
          - target: linux-x64
            os: ubuntu-latest
            native: '--native'
          - target: linux-arm64
            os: ubuntu-24.04-arm
            native: '--native'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.24'
      - name: Build canvas and check packaging boundaries
        run: |
          npm ci --prefix plugins/graph-skill
          npm run build --prefix plugins/graph-skill
          npm run pack:installer --prefix plugins/graph-skill
          npm test --prefix plugins/graph-skill
          uv run --no-project --python 3.11 python -B -m unittest discover -s plugins/graph-skill/tests -p 'test_*.py'
      - name: Build source-bound toolkit
        run: |
          uv build --no-sources --wheel --out-dir plugins/graph-skill/release/runtime-build
          uv run --no-project --python 3.11 python -B plugins/graph-skill/packaging/bundle.py --runtime-wheel plugins/graph-skill/release/runtime-build/graph_skill_runtime-0.1.0a1-py3-none-any.whl --platform '${{ matrix.target }}'
      - name: Inspect archive and run private runtime smoke
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('plugins/graph-skill/package.json')).version")
          uv run --no-project --python 3.11 python -B plugins/graph-skill/packaging/verify_bundle.py "plugins/graph-skill/release/graph-skill-${version}-${{ matrix.target }}.zip" --expected-source "$(git rev-parse HEAD)" ${{ matrix.native }}
      - name: Retain package and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolkit-${{ matrix.target }}
          path: |
            plugins/graph-skill/release/*.zip
            plugins/graph-skill/release/*.json
            plugins/graph-skill/release/*.log
            plugins/graph-skill/release/*.tgz
          if-no-files-found: warn
