name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts tools
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Validate feature contracts
        run: >-
          uv run python scripts/validate_round28_manifest.py
          spec/features.yaml
          spec/source_file_map.yaml
          spec/contract_map.yaml
      - name: Dependency audit
        run: uv run pip-audit
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate wheel contents
        run: uv run python scripts/smoke_built_wheel.py dist/*.whl
      - name: Smoke-test the built wheel
        run: |
          uv venv --python 3.11 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "import importlib.util, graph_skill_runtime; from graph_skill_runtime.adapters.mcp import create_server; assert importlib.util.find_spec('openai') is None; assert importlib.util.find_spec('langchain_openai') is None; assert importlib.util.find_spec('dotenv') is None; print(graph_skill_runtime.__name__, create_server().name)"
          .wheel-smoke/bin/gskill --version

  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: >-
          uv run pytest --tb=short -q
          --cov=src/graph_skill_runtime
          --cov-report=xml:coverage-runtime.xml
          --cov-report=term
      - name: Upload runtime coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-runtime.xml
          flags: runtime
          fail_ci_if_error: false

  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest --tb=short -q
